# Game identity for packaging. Read by the engine's desktop CPack helper, the Android Gradle
# host app, and (later) iOS Info.plist generation. Single source of truth for what a packaged
# build calls itself, so every platform ships under the same identity.
#
# Flat key=value (no INI sections) so Java Properties (gradle) and CMake file(STRINGS) both
# parse it with no library. Lines starting with `#` are comments.
#
# Required: name, package_id, version_name.
# Optional: version_code (default 1), vendor, description, icon.
#
# CLI override order at build time: CLI flag > this file > built-in default.

name         = Octarine Example
package_id   = com.octarine.example
version_name = 0.1.0
version_code = 1
vendor       = Octarine
description  = A simple test for the Octarine engine.
icon         = images/icon.png
splash_color = #1a2540
